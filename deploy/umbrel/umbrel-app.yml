manifestVersion: 1
id: hogariq
name: HogarIQ
tagline: Plataforma de Gobernanza Financiera Familiar 100% Privada y Self-Hosted
category: finance
version: "1.0.0"
port: 3010
description: >-
  HogarIQ es el sistema operativo financiero definitivo para hogares modernos.
  Diseñado para resolver los problemas reales de las familias:
  - Fórmula Safe-to-Spend: Conoce con certeza cuánto puedes gastar hoy sin comprometer tus compromisos fijos y ahorros.
  - OCR Local de Tickets y Facturas: Escanea comprobantes al instante sin enviar datos confidenciales a la nube de terceros.
  - Gastos Compartidos 50/50 (Estilo Splitwise): Liquidación de cuentas claras entre parejas y adultos sin discusiones.
  - Gamificación y Educación Financiera: Misiones y matching de ahorro para enseñar a los hijos hábitos saludables.
  - Motor Offline-First: Registra gastos incluso sin internet; tus operaciones se sincronizan automáticamente.
  100% de tus datos permanecen en tu servidor Umbrel con base de datos Postgres y soporte para pgvector.

