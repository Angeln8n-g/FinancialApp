<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="../assets/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Geist", -apple-system, sans-serif;
          background: #0A1128;
          color: #F8FAFC;
          display: grid;
          place-items: center;
        }
        .ambient-halo {
          position: absolute;
          width: 820px;
          height: 820px;
          left: 50%;
          top: 48%;
          transform: translate(-50%, -50%);
          border-radius: 999px;
          background: radial-gradient(
            circle at 50% 50%,
            rgba(16, 185, 129, 0.16) 0%,
            rgba(56, 189, 248, 0.08) 38%,
            rgba(10, 17, 40, 0) 70%
          );
          pointer-events: none;
          will-change: transform, opacity;
        }
        .end-stack {
          position: relative;
          z-index: 2;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 28px;
          max-width: 1200px;
        }
        .mark-badge {
          width: 224px;
          height: 224px;
          border-radius: 52px;
          background: #101A36;
          border: 1.5px solid #1E2B4D;
          box-shadow:
            0 36px 84px -18px rgba(2, 6, 23, 0.85),
            0 0 64px -16px rgba(16, 185, 129, 0.30);
          display: grid;
          place-items: center;
        }
        .brand-svg {
          width: 148px;
          height: 148px;
          overflow: visible;
        }
        .logo-roof {
          stroke-dasharray: 64;
          stroke-dashoffset: 64;
        }
        .logo-bar {
          transform-box: fill-box;
          transform-origin: bottom center;
        }
        .logo-spark {
          transform-box: fill-box;
          transform-origin: center center;
        }

        .wordmark-row {
          display: flex;
          align-items: center;
          gap: 16px;
          margin-top: 6px;
        }
        .wordmark {
          font-size: 64px;
          font-weight: 800;
          letter-spacing: -0.035em;
          color: #F8FAFC;
          line-height: 1;
        }
        .wordmark span {
          color: #10B981;
        }
        .hogar-pill {
          padding: 8px 16px;
          border-radius: 10px;
          background: rgba(16, 185, 129, 0.16);
          border: 1.5px solid rgba(16, 185, 129, 0.38);
          color: #34D399;
          font-size: 20px;
          font-weight: 800;
          letter-spacing: 0.12em;
        }

        #end-tagline {
          font-size: 56px;
          font-weight: 700;
          letter-spacing: -0.025em;
          color: #CBD5E1;
          line-height: 1.15;
          margin-top: -6px;
        }

        .cta-pill {
          margin-top: 10px;
          display: inline-flex;
          align-items: center;
          gap: 14px;
          padding: 20px 38px;
          border-radius: 999px;
          background: #047857;
          border: 1.5px solid #10B981;
          box-shadow:
            0 18px 42px -10px rgba(4, 120, 87, 0.55),
            0 0 0 1px rgba(16, 185, 129, 0.25);
          color: #FFFFFF;
          font-size: 28px;
          font-weight: 700;
          letter-spacing: -0.01em;
        }
      </style>

      <div id="root" data-composition-id="end-card" data-duration="3.75" data-fps="30">
        <div class="ambient-halo"></div>

        <div class="end-stack">
          <div class="mark-badge">
            <svg class="brand-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="ecRoofGrad" x1="8" y1="28" x2="56" y2="12" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#34D399"/>
                  <stop offset="100%" stop-color="#10B981"/>
                </linearGradient>
                <linearGradient id="ecBar1Grad" x1="20" y1="34" x2="20" y2="48" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#6EE7B7"/>
                  <stop offset="100%" stop-color="#059669"/>
                </linearGradient>
                <linearGradient id="ecBar2Grad" x1="30" y1="27" x2="30" y2="48" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#38BDF8"/>
                  <stop offset="100%" stop-color="#0284C7"/>
                </linearGradient>
                <linearGradient id="ecBar3Grad" x1="40" y1="22" x2="40" y2="48" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#F59E0B"/>
                  <stop offset="100%" stop-color="#D97706"/>
                </linearGradient>
              </defs>
              <path
                class="logo-roof"
                d="M 10 28 L 32 13 L 54 28"
                stroke="url(#ecRoofGrad)"
                stroke-width="4.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <rect class="logo-bar logo-bar-1" x="18" y="34" width="5.5" height="14" rx="1.5" fill="url(#ecBar1Grad)"/>
              <rect class="logo-bar logo-bar-2" x="27.5" y="27" width="5.5" height="21" rx="1.5" fill="url(#ecBar2Grad)"/>
              <rect class="logo-bar logo-bar-3" x="37" y="22" width="5.5" height="26" rx="1.5" fill="url(#ecBar3Grad)"/>
              <circle class="logo-spark" cx="48" cy="15" r="2.6" fill="#34D399"/>
            </svg>
          </div>

          <div class="wordmark-row">
            <span class="wordmark">Hogar<span>IQ</span></span>
            <span class="hogar-pill" data-layout-ignore>HOGAR</span>
          </div>

          <p id="end-tagline">Tu hogar en una sola cuenta.</p>

          <div class="cta-pill">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
              <path d="M2 12h20"/>
            </svg>
            <span>hogariq.kasino21.com</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          // Badge settles from Scene 4's center morph without empty dark seam (0.00s..0.42s)
          tl.fromTo(
            ".mark-badge",
            { scale: 0.88, opacity: 0.85 },
            { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out" },
            0
          );

          // Performed SVG logo: roof stroke draws -> 3 rising bars -> spark dot pop!
          tl.fromTo(
            ".logo-roof",
            { strokeDashoffset: 64 },
            { strokeDashoffset: 0, duration: 0.46, ease: "power3.out" },
            0.08
          );
          tl.fromTo(
            ".logo-bar",
            { scaleY: 0, opacity: 0 },
            { scaleY: 1, opacity: 1, duration: 0.36, stagger: 0.08, ease: "back.out(1.4)" },
            0.22
          );
          tl.fromTo(
            ".logo-spark",
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.28, ease: "back.out(2.4)" },
            0.56
          );

          // Wordmark locks aligned with click.mp3 @ 0.40s local (29.15s global)
          tl.fromTo(
            ".wordmark-row",
            { y: 18, opacity: 0, filter: "blur(6px)" },
            { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.44, ease: "expo.out" },
            0.36
          );

          // Tagline & CTA settle cleanly before 1.25s, then HOLD ROCK-STEADY for final 2.50s
          tl.fromTo(
            "#end-tagline",
            { y: 14, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.42, ease: "expo.out" },
            0.54
          );
          tl.fromTo(
            ".cta-pill",
            { y: 16, scale: 0.94, opacity: 0 },
            { y: 0, scale: 1, opacity: 1, duration: 0.44, ease: "back.out(1.4)" },
            0.72
          );

          // Subtle background halo breath only (all typography stays 100% dead-still!)
          tl.fromTo(
            ".ambient-halo",
            { scale: 0.94, opacity: 0.72 },
            { scale: 1.07, opacity: 1, duration: 3.70, ease: "sine.inOut" },
            0
          );

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["end-card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
