<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101A36" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>
    <linearGradient id="mintRoofGrad" x1="10" y1="13" x2="54" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="mintBar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="mintBar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="mintBar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded card tile -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#34D399" stroke-opacity="0.3" stroke-width="1"/>

  <!-- House Roof -->
  <path d="M 10 28 L 32 13 L 54 28" stroke="url(#mintRoofGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Financial Growth Bars -->
  <rect x="18" y="34" width="5.5" height="14" rx="1.5" fill="url(#mintBar1)"/>
  <rect x="27.5" y="27" width="5.5" height="21" rx="1.5" fill="url(#mintBar2)"/>
  <rect x="37" y="22" width="5.5" height="26" rx="1.5" fill="url(#mintBar3)"/>

  <!-- Spark node -->
  <circle cx="48" cy="15" r="3" fill="#34D399"/>
  <circle cx="48" cy="15" r="1.3" fill="#FFFFFF"/>
</svg>