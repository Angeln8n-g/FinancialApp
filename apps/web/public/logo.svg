<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoRoofGrad" x1="40" y1="40" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="logoBar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="logoBar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="logoBar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="260" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="iqBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- ICON MARK (Left Side) -->
  <g transform="translate(20, 20)">
    <!-- House Roof -->
    <path d="M 30 110 L 100 45 L 170 110" stroke="url(#logoRoofGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Financial Bars -->
    <rect x="62" y="125" width="18" height="40" rx="5" fill="url(#logoBar1)"/>
    <rect x="91" y="100" width="18" height="65" rx="5" fill="url(#logoBar2)"/>
    <rect x="120" y="78" width="18" height="87" rx="5" fill="url(#logoBar3)"/>
    <!-- AI Spark Dot -->
    <circle cx="160" cy="50" r="10" fill="#38BDF8"/>
    <circle cx="160" cy="50" r="5" fill="#FFFFFF"/>
  </g>

  <!-- TEXT BRANDING (Right Side) -->
  <g transform="translate(230, 70)">
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="url(#textGrad)" letter-spacing="-2">Hogar<tspan fill="#A855F7">IQ</tspan></text>
    <rect x="365" y="12" width="56" height="28" rx="8" fill="url(#iqBadgeGrad)" opacity="0.9"/>
    <text x="393" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">AI</text>
    
    <text x="5" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#94A3B8" letter-spacing="4">ASISTENTE FINANCIERO FAMILIAR</text>
  </g>
</svg>
